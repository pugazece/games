<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Toddler Animal Balloon Pop - Endless Floating Emojis</title>
  <style>
    /* Reset & Prevent accidental touch interactions */
    *, *::before, *::after {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #08071e;
      font-family: 'Comic Sans MS', 'Chalkboard SE', 'Quicksand', -apple-system, BlinkMacSystemFont, sans-serif;
      touch-action: none;
    }

    #game-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #08071e;
    }

    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: block;
      z-index: 1;
    }

    /* Top HUD */
    .top-bar {
      position: absolute;
      top: max(10px, env(safe-area-inset-top));
      left: 0;
      right: 0;
      z-index: 20;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 14px;
      pointer-events: none;
    }

    .top-bar > * {
      pointer-events: auto;
    }

    .stats-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .stat-badge {
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      padding: 6px 14px;
      border-radius: 999px;
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
      border: 2px solid #ffde59;
      font-weight: 900;
      color: #3b145a;
      font-size: 0.95rem;
    }

    .stat-badge.crown-badge {
      border-color: #f59e0b;
      background: linear-gradient(135deg, #fffbeb, #ffffff);
      color: #b45309;
    }

    .control-group {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .hud-btn {
      background: rgba(255, 255, 255, 0.92);
      border: 2.5px solid #ffffff;
      border-radius: 999px;
      padding: 6px 13px;
      font-size: 0.95rem;
      font-weight: 800;
      color: #2b1055;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.28);
      transition: transform 0.12s ease, opacity 0.2s ease;
      outline: none;
    }

    .hud-btn:active {
      transform: scale(0.92);
    }

    .hud-btn.off {
      opacity: 0.55;
      background: rgba(220, 220, 230, 0.85);
      filter: grayscale(0.8);
    }

    /* Bottom Collection Shelf */
    .bottom-shelf {
      position: absolute;
      bottom: max(10px, env(safe-area-inset-bottom));
      left: 50%;
      transform: translateX(-50%);
      width: min(96vw, 780px);
      background: rgba(18, 14, 46, 0.86);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 2.5px solid rgba(255, 255, 255, 0.25);
      border-radius: 24px;
      padding: 8px 12px;
      z-index: 20;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: 0 10px 32px rgba(0, 0, 0, 0.6), inset 0 1px 1px rgba(255, 255, 255, 0.4);
      pointer-events: auto;
    }

    .shelf-header {
      font-size: 0.82rem;
      font-weight: 800;
      color: #ffd875;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-bottom: 6px;
      display: flex;
      justify-content: space-between;
      width: 100%;
      padding: 0 4px;
    }

    .shelf-grid {
      display: grid;
      grid-template-columns: repeat(10, 1fr);
      gap: 5px;
      width: 100%;
    }

    .shelf-slot {
      aspect-ratio: 1;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.08);
      border: 2px dashed rgba(255, 255, 255, 0.3);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      position: relative;
      transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
      cursor: pointer;
    }

    .shelf-slot.locked {
      filter: grayscale(1) opacity(0.3);
    }

    .shelf-slot.unlocked {
      background: linear-gradient(135deg, #fffbeb, #ffffff);
      border: 2.5px solid #ffbe0b;
      filter: none;
      transform: scale(1.05);
      box-shadow: 0 0 14px rgba(255, 215, 0, 0.75);
    }

    .shelf-slot.just-unlocked {
      animation: slotBounce 0.65s ease-out;
    }

    @keyframes slotBounce {
      0% { transform: scale(0.6) rotate(-14deg); }
      50% { transform: scale(1.32) rotate(10deg); }
      100% { transform: scale(1.05) rotate(0deg); }
    }

    .shelf-slot .slot-label {
      font-size: 0.55rem;
      font-weight: 900;
      color: #3b1d60;
      margin-top: 1px;
      display: none;
    }
    @media (min-width: 600px) {
      .shelf-slot .slot-label {
        display: block;
      }
    }

    /* Floating Educational Pop Card (Minimal, Compact & Non-intrusive) */
    .edu-toast {
      position: absolute;
      top: 18%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.6);
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 3.5px solid #ffbe0b;
      border-radius: 999px;
      padding: 10px 24px;
      display: inline-flex;
      align-items: center;
      gap: 12px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35), 0 0 25px rgba(255, 215, 0, 0.45);
      z-index: 50;
      opacity: 0;
      pointer-events: none;
      transition: transform 0.28s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.2s ease;
      white-space: nowrap;
    }

    .edu-toast.show {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1.05);
    }

    .toast-emoji {
      font-size: 2.6rem;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .toast-title {
      font-size: 1.85rem;
      font-weight: 900;
      color: #2b0c52;
      line-height: 1;
      letter-spacing: 0.5px;
    }

    /* Celebration Banner */
    .celebration-banner {
      position: absolute;
      top: 14%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.5);
      background: linear-gradient(135deg, #ff007f, #7928ca, #ffbe0b);
      color: #ffffff;
      padding: 14px 30px;
      border-radius: 999px;
      font-size: 1.25rem;
      font-weight: 900;
      text-align: center;
      box-shadow: 0 10px 40px rgba(255, 0, 128, 0.5), 0 0 35px rgba(255, 215, 0, 0.85);
      border: 3px solid #ffffff;
      z-index: 60;
      opacity: 0;
      pointer-events: none;
      transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.3s ease;
      white-space: nowrap;
    }

    .celebration-banner.show {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1.05);
    }
  </style>
</head>
<body>
  <div id="game-container">
    <canvas id="gameCanvas"></canvas>

    <!-- Top HUD -->
    <header class="top-bar">
      <div class="stats-group">
        <div class="stat-badge">
          <span>🎈</span>
          <span id="score-display">0</span>
        </div>
        <div class="stat-badge crown-badge">
          <span>⭐</span>
          <span id="rounds-display">0</span>
        </div>
      </div>

      <div class="control-group">
        <!-- Speed Selector -->
        <button id="speed-btn" class="hud-btn" title="Float Speed">
          <span id="speed-icon">🐰</span>
          <span id="speed-text" style="font-size:0.85rem;">Normal</span>
        </button>

        <!-- Sound Toggle -->
        <button id="sfx-btn" class="hud-btn" title="Toggle Sound">
          <span id="sfx-icon">🔊</span>
        </button>

        <!-- Speech Toggle -->
        <button id="speech-btn" class="hud-btn" title="Toggle Animal Voice">
          <span id="speech-icon">🗣️</span>
        </button>
      </div>
    </header>

    <!-- Celebration Banner -->
    <div id="celebration-banner" class="celebration-banner">
      🎉 Wonderful Job! All 10 Friends Discovered! ⭐ +1
    </div>

    <!-- Educational Pop Toast Card (Emoji + Name Only) -->
    <div id="edu-toast" class="edu-toast">
      <div id="toast-emoji" class="toast-emoji">🦁</div>
      <div id="toast-title" class="toast-title">Lion</div>
    </div>

    <!-- Collection Shelf (10 slots) -->
    <footer class="bottom-shelf">
      <div class="shelf-header">
        <span>🌟 Animal Friends Collected</span>
        <span id="collection-counter">0 / 10</span>
      </div>
      <div class="shelf-grid" id="shelf-grid"></div>
    </footer>
  </div>

  <script>
    /**
     * Toddler Animal Balloon Pop - Endless Edition with Direct Floating Emojis
     * The animals themselves are the balloons! Equipped with tied bottom knots,
     * physics ribbon strings, high-contrast readable pill tags, and glowing auras.
     */

    const ANIMAL_DATA = [
      {
        id: 'lion',
        name: 'Lion',
        emoji: '🦁',
        speech: 'Lion!',
        knotColor: '#f97316',
        glowColor: '#fb923c'
      },
      {
        id: 'elephant',
        name: 'Elephant',
        emoji: '🐘',
        speech: 'Elephant!',
        knotColor: '#0284c7',
        glowColor: '#38bdf8'
      },
      {
        id: 'monkey',
        name: 'Monkey',
        emoji: '🐒',
        speech: 'Monkey!',
        knotColor: '#9333ea',
        glowColor: '#c084fc'
      },
      {
        id: 'giraffe',
        name: 'Giraffe',
        emoji: '🦒',
        speech: 'Giraffe!',
        knotColor: '#eab308',
        glowColor: '#fde047'
      },
      {
        id: 'bear',
        name: 'Bear',
        emoji: '🐻',
        speech: 'Bear!',
        knotColor: '#d97706',
        glowColor: '#f59e0b'
      },
      {
        id: 'zebra',
        name: 'Zebra',
        emoji: '🦓',
        speech: 'Zebra!',
        knotColor: '#ec4899',
        glowColor: '#f472b6'
      },
      {
        id: 'tiger',
        name: 'Tiger',
        emoji: '🐯',
        speech: 'Tiger!',
        knotColor: '#ef4444',
        glowColor: '#f87171'
      },
      {
        id: 'panda',
        name: 'Panda',
        emoji: '🐼',
        speech: 'Panda!',
        knotColor: '#64748b',
        glowColor: '#cbd5e1'
      },
      {
        id: 'rabbit',
        name: 'Rabbit',
        emoji: '🐰',
        speech: 'Rabbit!',
        knotColor: '#f43f5e',
        glowColor: '#fb7185'
      },
      {
        id: 'frog',
        name: 'Frog',
        emoji: '🐸',
        speech: 'Frog!',
        knotColor: '#22c55e',
        glowColor: '#4ade80'
      }
    ];

    // --- Web Audio Synthesizer ---
    class SoundEngine {
      constructor() {
        this.ctx = null;
        this.enabled = true;
      }

      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (AudioContext) {
            this.ctx = new AudioContext();
          }
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }

      playPop() {
        if (!this.enabled) return;
        this.init();
        if (!this.ctx) return;

        const now = this.ctx.currentTime;

        // 1. Air burst snap
        const bufferSize = Math.floor(this.ctx.sampleRate * 0.06);
        const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
          data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (bufferSize * 0.2));
        }

        const noise = this.ctx.createBufferSource();
        noise.buffer = buffer;

        const filter = this.ctx.createBiquadFilter();
        filter.type = 'bandpass';
        filter.frequency.setValueAtTime(1400, now);
        filter.Q.setValueAtTime(2.0, now);

        const noiseGain = this.ctx.createGain();
        noiseGain.gain.setValueAtTime(0.75, now);
        noiseGain.gain.exponentialRampToValueAtTime(0.01, now + 0.06);

        noise.connect(filter);
        filter.connect(noiseGain);
        noiseGain.connect(this.ctx.destination);
        noise.start(now);

        // 2. Resonant pop thump
        const osc = this.ctx.createOscillator();
        const oscGain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(340, now);
        osc.frequency.exponentialRampToValueAtTime(50, now + 0.1);

        oscGain.gain.setValueAtTime(0.75, now);
        oscGain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);

        osc.connect(oscGain);
        oscGain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.11);

        // 3. Cheerful melodic chime
        const notes = [523.25, 659.25, 783.99, 1046.50, 1318.51];
        const randomNote = notes[Math.floor(Math.random() * notes.length)];
        const chime = this.ctx.createOscillator();
        const chimeGain = this.ctx.createGain();
        chime.type = 'triangle';
        chime.frequency.setValueAtTime(randomNote, now);
        chime.frequency.exponentialRampToValueAtTime(randomNote * 1.3, now + 0.24);

        chimeGain.gain.setValueAtTime(0.35, now);
        chimeGain.gain.exponentialRampToValueAtTime(0.001, now + 0.26);

        chime.connect(chimeGain);
        chimeGain.connect(this.ctx.destination);
        chime.start(now + 0.02);
        chime.stop(now + 0.28);
      }

      playFanfare() {
        if (!this.enabled) return;
        this.init();
        if (!this.ctx) return;

        const melody = [
          { f: 523.25, d: 0.14 }, // C5
          { f: 659.25, d: 0.14 }, // E5
          { f: 783.99, d: 0.14 }, // G5
          { f: 1046.50, d: 0.38 } // C6
        ];

        let time = this.ctx.currentTime;
        melody.forEach(note => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.value = note.f;

          gain.gain.setValueAtTime(0.45, time);
          gain.gain.exponentialRampToValueAtTime(0.001, time + note.d);

          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(time);
          osc.stop(time + note.d + 0.05);
          time += note.d * 0.88;
        });
      }
    }

    // --- Web Speech API ---
    class VoiceEngine {
      constructor() {
        this.enabled = true;
      }

      speak(text) {
        if (!this.enabled) return;
        if (!('speechSynthesis' in window)) return;

        try {
          window.speechSynthesis.cancel();
          const utterance = new SpeechSynthesisUtterance(text);
          utterance.rate = 0.92;
          utterance.pitch = 1.25;

          const voices = window.speechSynthesis.getVoices();
          const friendly = voices.find(v => (v.name.includes('Natural') || v.name.includes('Samantha') || v.name.includes('Victoria')) && v.lang.startsWith('en'));
          if (friendly) utterance.voice = friendly;

          window.speechSynthesis.speak(utterance);
        } catch (e) {
          console.warn("Speech synthesis unavailable:", e);
        }
      }
    }

    // --- Direct Floating Emoji Balloon ---
    class DirectEmojiBalloon {
      constructor(data, x, y, size, speed) {
        this.data = data;
        this.baseX = x;
        this.x = x;
        this.y = y;
        this.size = size; // e.g. 130px - 160px
        this.speed = speed;

        this.swayAmp = 40 + Math.random() * 16;
        this.swayFreq = 0.015 + Math.random() * 0.008;
        this.swayPhase = Math.random() * Math.PI * 2;
        this.tiltMax = 0.16 + Math.random() * 0.06;

        // Dangling ribbon string segments (5 joints)
        this.ribbonPoints = [];
        this.segmentCount = 6;
        this.segmentLen = size * 0.22;
        const knotStartY = this.y + size * 0.45;
        for (let i = 0; i < this.segmentCount; i++) {
          this.ribbonPoints.push({ x: this.x, y: knotStartY + i * this.segmentLen });
        }
      }

      update() {
        this.y -= this.speed;
        this.swayPhase += this.swayFreq;
        this.x = this.baseX + Math.sin(this.swayPhase) * this.swayAmp;
        this.rotation = Math.cos(this.swayPhase) * this.tiltMax;

        // Update trailing physics ribbon string
        const knotX = this.x;
        const knotY = this.y + this.size * 0.44;
        this.ribbonPoints[0] = { x: knotX, y: knotY };

        for (let i = 1; i < this.segmentCount; i++) {
          const prev = this.ribbonPoints[i - 1];
          const curr = this.ribbonPoints[i];
          curr.x += (prev.x + Math.sin(this.swayPhase - i * 0.35) * 8 - curr.x) * 0.35;
          curr.y += (prev.y + this.segmentLen - curr.y) * 0.35;
        }
      }

      isHit(px, py) {
        // Generous touch hitbox centered right over the big emoji
        const dx = px - this.x;
        const dy = py - this.y;
        return (dx * dx + dy * dy) <= (this.size * 0.72) ** 2;
      }

      draw(ctx) {
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate(this.rotation);

        const s = this.size;

        // 1. Physics Dangling Ribbon String
        this.drawRibbon(ctx, s);

        // 2. Tied Balloon Knot at Bottom Center of Emoji
        this.drawKnot(ctx, s);

        // 3. Clean Natural Emoji Rendering (No artificial radial glow or specular gloss overlays)
        ctx.font = `${Math.round(s)}px -apple-system, "Segoe UI Emoji", "Noto Color Emoji", sans-serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(this.data.emoji, 0, -s * 0.04);

        ctx.restore();
      }

      drawKnot(ctx, s) {
        ctx.save();
        const knotY = s * 0.44;
        ctx.fillStyle = this.data.knotColor;
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 2;

        // Cute triangular balloon tie knot
        ctx.beginPath();
        ctx.moveTo(-10, knotY - 4);
        ctx.lineTo(10, knotY - 4);
        ctx.lineTo(0, knotY + 12);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();

        // Little center button knot
        ctx.beginPath();
        ctx.arc(0, knotY, 4, 0, Math.PI * 2);
        ctx.fillStyle = '#ffffff';
        ctx.fill();
        ctx.restore();
      }

      drawRibbon(ctx, s) {
        ctx.save();
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.85)';
        ctx.lineWidth = 3;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';

        ctx.beginPath();
        ctx.moveTo(0, s * 0.44);
        for (let i = 1; i < this.segmentCount; i++) {
          const pt = this.ribbonPoints[i];
          ctx.lineTo(pt.x - this.x, pt.y - this.y);
        }
        ctx.stroke();
        ctx.restore();
      }
    }

    // --- Particle Confetti Class ---
    class Particle {
      constructor(x, y, color, isFanfare = false) {
        this.x = x;
        this.y = y;
        this.color = color;
        const angle = Math.random() * Math.PI * 2;
        const speed = isFanfare ? (Math.random() * 8 + 4) : (Math.random() * 6.5 + 3);
        this.vx = Math.cos(angle) * speed;
        this.vy = Math.sin(angle) * speed - (isFanfare ? 5 : 3);
        this.gravity = 0.2;
        this.size = Math.random() * 9 + 6;
        this.rotation = Math.random() * Math.PI * 2;
        this.rotSpeed = (Math.random() * 0.22 - 0.11);
        this.alpha = 1;
        this.decay = Math.random() * 0.02 + 0.012;
        this.dead = false;
        this.isStar = Math.random() > 0.45;
      }

      update() {
        this.x += this.vx;
        this.y += this.vy;
        this.vy += this.gravity;
        this.rotation += this.rotSpeed;
        this.alpha -= this.decay;
        if (this.alpha <= 0) this.dead = true;
      }

      draw(ctx) {
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate(this.rotation);
        ctx.globalAlpha = Math.max(0, this.alpha);
        ctx.fillStyle = this.color;

        if (this.isStar) {
          ctx.beginPath();
          for (let i = 0; i < 5; i++) {
            ctx.lineTo(Math.cos((18 + i * 72) * 0.0174) * this.size, -Math.sin((18 + i * 72) * 0.0174) * this.size);
            ctx.lineTo(Math.cos((54 + i * 72) * 0.0174) * (this.size * 0.5), -Math.sin((54 + i * 72) * 0.0174) * (this.size * 0.5));
          }
          ctx.closePath();
          ctx.fill();
        } else {
          ctx.fillRect(-this.size / 2, -this.size / 2, this.size, this.size * 0.65);
        }
        ctx.restore();
      }
    }

    // --- Expanding Shockwave ---
    class Shockwave {
      constructor(x, y, color) {
        this.x = x;
        this.y = y;
        this.color = color;
        this.radius = 16;
        this.maxRadius = 110;
        this.alpha = 0.95;
        this.dead = false;
      }

      update() {
        this.radius += 5.2;
        this.alpha -= 0.045;
        if (this.alpha <= 0 || this.radius >= this.maxRadius) this.dead = true;
      }

      draw(ctx) {
        ctx.save();
        ctx.globalAlpha = Math.max(0, this.alpha);
        ctx.strokeStyle = this.color;
        ctx.lineWidth = 4;
        ctx.shadowColor = this.color;
        ctx.shadowBlur = 14;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();
      }
    }

    // --- Floating Score Indicator ---
    class FloatingText {
      constructor(x, y, text) {
        this.x = x;
        this.y = y;
        this.text = text;
        this.alpha = 1;
        this.vy = -2.4;
        this.dead = false;
      }

      update() {
        this.y += this.vy;
        this.alpha -= 0.024;
        if (this.alpha <= 0) this.dead = true;
      }

      draw(ctx) {
        ctx.save();
        ctx.globalAlpha = Math.max(0, this.alpha);
        ctx.fillStyle = '#ffde59';
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 4;
        ctx.font = "900 32px 'Comic Sans MS', sans-serif";
        ctx.textAlign = 'center';
        ctx.strokeText(this.text, this.x, this.y);
        ctx.fillText(this.text, this.x, this.y);
        ctx.restore();
      }
    }

    // --- Shooting Star ---
    class ShootingStar {
      constructor(w, h) {
        this.x = Math.random() * w * 0.8;
        this.y = Math.random() * (h * 0.35);
        this.len = Math.random() * 85 + 65;
        this.speed = Math.random() * 9 + 12;
        this.angle = Math.PI / 4 + (Math.random() * 0.2 - 0.1);
        this.alpha = 1;
        this.dead = false;
      }

      update() {
        this.x += Math.cos(this.angle) * this.speed;
        this.y += Math.sin(this.angle) * this.speed;
        this.alpha -= 0.035;
        if (this.alpha <= 0) this.dead = true;
      }

      draw(ctx) {
        ctx.save();
        ctx.globalAlpha = Math.max(0, this.alpha);
        const tailX = this.x - Math.cos(this.angle) * this.len;
        const tailY = this.y - Math.sin(this.angle) * this.len;
        const grad = ctx.createLinearGradient(tailX, tailY, this.x, this.y);
        grad.addColorStop(0, 'rgba(255, 255, 255, 0)');
        grad.addColorStop(1, 'rgba(255, 255, 255, 0.95)');
        ctx.strokeStyle = grad;
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        ctx.moveTo(tailX, tailY);
        ctx.lineTo(this.x, this.y);
        ctx.stroke();
        ctx.restore();
      }
    }

    // --- Main Game Engine ---
    class Game {
      constructor() {
        this.canvas = document.getElementById('gameCanvas');
        this.ctx = this.canvas.getContext('2d');

        this.sound = new SoundEngine();
        this.voice = new VoiceEngine();

        // Speed settings
        this.speedModes = [
          { name: 'Slow', icon: '🐢', min: 0.45, max: 0.70 },
          { name: 'Normal', icon: '🐰', min: 0.85, max: 1.25 },
          { name: 'Fast', icon: '🐆', min: 1.40, max: 1.95 }
        ];
        this.currentSpeedIndex = 1;

        // Endless tracking stats
        this.score = 0;
        this.roundsCompleted = 0;
        this.unlockedInCurrentRound = new Set();
        this.activeAnimals = new Set(); // Strict duplicate prevention

        this.balloons = [];
        this.particles = [];
        this.floatTexts = [];
        this.stars = [];
        this.clouds = [];
        this.shootingStars = [];

        this.spawnTimer = 0;
        this.spawnInterval = 75;

        this.width = window.innerWidth;
        this.height = window.innerHeight;
        this.dpr = Math.min(window.devicePixelRatio || 1, 2);

        this.initDOM();
        this.initShelf();
        this.resize();
        this.initCosmicSky();
        this.attachEventListeners();

        requestAnimationFrame((t) => this.loop(t));
      }

      initDOM() {
        this.scoreDisplay = document.getElementById('score-display');
        this.roundsDisplay = document.getElementById('rounds-display');
        this.collectionCounter = document.getElementById('collection-counter');
        this.speedBtn = document.getElementById('speed-btn');
        this.speedIcon = document.getElementById('speed-icon');
        this.speedText = document.getElementById('speed-text');
        this.sfxBtn = document.getElementById('sfx-btn');
        this.sfxIcon = document.getElementById('sfx-icon');
        this.speechBtn = document.getElementById('speech-btn');
        this.speechIcon = document.getElementById('speech-icon');
        this.celebrationBanner = document.getElementById('celebration-banner');

        this.eduToast = document.getElementById('edu-toast');
        this.toastEmoji = document.getElementById('toast-emoji');
        this.toastTitle = document.getElementById('toast-title');
      }

      initShelf() {
        const shelfGrid = document.getElementById('shelf-grid');
        shelfGrid.innerHTML = '';
        ANIMAL_DATA.forEach(animal => {
          const slot = document.createElement('div');
          slot.className = 'shelf-slot locked';
          slot.id = `shelf-slot-${animal.id}`;
          slot.innerHTML = `
            <span>${animal.emoji}</span>
            <span class="slot-label">${animal.name}</span>
          `;
          slot.addEventListener('click', () => {
            this.sound.playPop();
            this.voice.speak(animal.speech);
            this.showEducationalToast(animal);
          });
          shelfGrid.appendChild(slot);
        });
      }

      resize() {
        this.width = window.innerWidth;
        this.height = window.innerHeight;
        this.canvas.width = this.width * this.dpr;
        this.canvas.height = this.height * this.dpr;
        this.ctx.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);

        if (this.stars.length === 0) {
          this.initCosmicSky();
        }
      }

      initCosmicSky() {
        this.stars = [];
        const count = Math.floor((this.width * this.height) / 7200);
        for (let i = 0; i < count; i++) {
          this.stars.push({
            x: Math.random() * this.width,
            y: Math.random() * (this.height * 0.78),
            size: Math.random() * 2.2 + 0.8,
            baseAlpha: Math.random() * 0.5 + 0.3,
            phase: Math.random() * Math.PI * 2,
            color: Math.random() > 0.4 ? '#ffffff' : (Math.random() > 0.5 ? '#fde047' : '#93c5fd')
          });
        }

        this.clouds = [
          { x: this.width * 0.1, y: this.height * 0.16, r: 68, speed: 0.12, alpha: 0.14 },
          { x: this.width * 0.65, y: this.height * 0.26, r: 90, speed: 0.16, alpha: 0.11 },
          { x: this.width * 0.35, y: this.height * 0.5, r: 75, speed: 0.09, alpha: 0.10 }
        ];
      }

      attachEventListeners() {
        window.addEventListener('resize', () => this.resize());

        // Zero-latency multi-touch / pointer
        this.canvas.addEventListener('pointerdown', (e) => this.handlePointer(e));

        // Speed Toggle
        this.speedBtn.addEventListener('click', () => {
          this.sound.init();
          this.currentSpeedIndex = (this.currentSpeedIndex + 1) % this.speedModes.length;
          const mode = this.speedModes[this.currentSpeedIndex];
          this.speedIcon.textContent = mode.icon;
          this.speedText.textContent = mode.name;
        });

        // Sound Toggle
        this.sfxBtn.addEventListener('click', () => {
          this.sound.enabled = !this.sound.enabled;
          this.sfxIcon.textContent = this.sound.enabled ? '🔊' : '🔇';
          this.sfxBtn.classList.toggle('off', !this.sound.enabled);
        });

        // Speech Toggle
        this.speechBtn.addEventListener('click', () => {
          this.voice.enabled = !this.voice.enabled;
          this.speechIcon.textContent = this.voice.enabled ? '🗣️' : '🤫';
          this.speechBtn.classList.toggle('off', !this.voice.enabled);
        });
      }

      spawnBalloon() {
        // Strict Duplicate Prevention: Filter out animals currently floating
        const availableAnimals = ANIMAL_DATA.filter(a => !this.activeAnimals.has(a.id));
        if (availableAnimals.length === 0) return;

        // Bias towards uncollected animals for the current round
        const uncollected = availableAnimals.filter(a => !this.unlockedInCurrentRound.has(a.id));
        const chosenData = uncollected.length > 0 && Math.random() < 0.72
          ? uncollected[Math.floor(Math.random() * uncollected.length)]
          : availableAnimals[Math.floor(Math.random() * availableAnimals.length)];

        const spdMode = this.speedModes[this.currentSpeedIndex];
        const speed = spdMode.min + Math.random() * (spdMode.max - spdMode.min);

        // Generous size for toddlers: ~125px to 155px
        const baseSize = Math.min(this.width * 0.28, 145);
        const size = Math.max(105, baseSize + (Math.random() * 15 - 7));

        const minX = size * 0.6 + 20;
        const maxX = this.width - size * 0.6 - 20;
        const startX = minX + Math.random() * (maxX - minX);

        const balloon = new DirectEmojiBalloon(chosenData, startX, this.height + size * 0.8, size, speed);
        this.balloons.push(balloon);
        this.activeAnimals.add(chosenData.id);
      }

      handlePointer(e) {
        this.sound.init();
        const rect = this.canvas.getBoundingClientRect();
        const touchX = e.clientX - rect.left;
        const touchY = e.clientY - rect.top;

        for (let i = this.balloons.length - 1; i >= 0; i--) {
          const b = this.balloons[i];
          if (b.isHit(touchX, touchY)) {
            this.popBalloon(b, i);
            break;
          }
        }
      }

      popBalloon(balloon, index) {
        this.activeAnimals.delete(balloon.data.id);
        this.balloons.splice(index, 1);

        this.sound.playPop();
        this.voice.speak(balloon.data.speech);

        this.score += 1;
        this.scoreDisplay.textContent = this.score;

        this.showEducationalToast(balloon.data);
        this.createPopEffects(balloon.x, balloon.y, balloon.data.glowColor);

        // Shelf unlock
        if (!this.unlockedInCurrentRound.has(balloon.data.id)) {
          this.unlockedInCurrentRound.add(balloon.data.id);
          this.updateShelfSlot(balloon.data.id);
        }
      }

      showEducationalToast(data) {
        clearTimeout(this.toastTimeout);
        this.toastEmoji.textContent = data.emoji;
        this.toastTitle.textContent = data.name;

        this.eduToast.classList.add('show');
        this.toastTimeout = setTimeout(() => {
          this.eduToast.classList.remove('show');
        }, 1600);
      }

      updateShelfSlot(animalId) {
        const slot = document.getElementById(`shelf-slot-${animalId}`);
        if (slot) {
          slot.classList.remove('locked');
          slot.classList.add('unlocked', 'just-unlocked');
          setTimeout(() => slot.classList.remove('just-unlocked'), 700);
        }

        this.collectionCounter.textContent = `${this.unlockedInCurrentRound.size} / ${ANIMAL_DATA.length}`;

        // Endless Loop: Celebrate then reset when all 10 collected
        if (this.unlockedInCurrentRound.size === ANIMAL_DATA.length) {
          setTimeout(() => {
            this.triggerEndlessCelebration();
          }, 600);
        }
      }

      triggerEndlessCelebration() {
        this.roundsCompleted += 1;
        this.roundsDisplay.textContent = this.roundsCompleted;

        this.sound.playFanfare();
        this.voice.speak("Wonderful job! You discovered all ten animal friends! Keep on popping!");

        // Show celebration banner
        this.celebrationBanner.classList.add('show');
        setTimeout(() => {
          this.celebrationBanner.classList.remove('show');
        }, 3400);

        // Confetti shower
        for (let i = 0; i < 75; i++) {
          this.particles.push(new Particle(
            this.width / 2 + (Math.random() * 260 - 130),
            this.height / 2 - 40,
            ['#ff007f', '#ffd23f', '#00f2fe', '#4ade80', '#c084fc', '#ffffff'][Math.floor(Math.random() * 6)],
            true
          ));
        }

        // Reset collection shelf seamlessly so the toddler can play forever
        setTimeout(() => {
          this.unlockedInCurrentRound.clear();
          this.initShelf();
          this.collectionCounter.textContent = `0 / ${ANIMAL_DATA.length}`;
        }, 2400);
      }

      createPopEffects(x, y, color) {
        this.particles.push(new Shockwave(x, y, color));
        this.floatTexts.push(new FloatingText(x, y - 35, "+1 ⭐"));

        const colors = [color, '#ffffff', '#ffeb3b', '#ff007f', '#00f2fe'];
        for (let i = 0; i < 30; i++) {
          const col = colors[Math.floor(Math.random() * colors.length)];
          this.particles.push(new Particle(x, y, col));
        }
      }

      loop(currentTime) {
        this.update();
        this.render();
        requestAnimationFrame((t) => this.loop(t));
      }

      update() {
        this.spawnTimer++;
        if (this.spawnTimer >= this.spawnInterval) {
          this.spawnTimer = 0;
          if (this.balloons.length < 5) {
            this.spawnBalloon();
          }
        }

        if (Math.random() < 0.008 && this.shootingStars.length < 2) {
          this.shootingStars.push(new ShootingStar(this.width, this.height));
        }

        for (let i = this.shootingStars.length - 1; i >= 0; i--) {
          const s = this.shootingStars[i];
          s.update();
          if (s.dead) this.shootingStars.splice(i, 1);
        }

        for (let i = this.balloons.length - 1; i >= 0; i--) {
          const b = this.balloons[i];
          b.update();
          if (b.y < -b.size * 1.5) {
            this.activeAnimals.delete(b.data.id);
            this.balloons.splice(i, 1);
          }
        }

        for (let i = this.particles.length - 1; i >= 0; i--) {
          const p = this.particles[i];
          p.update();
          if (p.dead) this.particles.splice(i, 1);
        }

        for (let i = this.floatTexts.length - 1; i >= 0; i--) {
          const ft = this.floatTexts[i];
          ft.update();
          if (ft.dead) this.floatTexts.splice(i, 1);
        }
      }

      render() {
        const ctx = this.ctx;

        // Twilight Cosmic Gradient
        const skyGrad = ctx.createLinearGradient(0, 0, 0, this.height);
        skyGrad.addColorStop(0, '#08071e');
        skyGrad.addColorStop(0.45, '#190e3d');
        skyGrad.addColorStop(0.85, '#351052');
        skyGrad.addColorStop(1, '#150926');
        ctx.fillStyle = skyGrad;
        ctx.fillRect(0, 0, this.width, this.height);

        this.drawMoon(ctx);
        this.drawStars(ctx);
        this.drawClouds(ctx);

        this.shootingStars.forEach(s => s.draw(ctx));
        this.balloons.forEach(b => b.draw(ctx));
        this.particles.forEach(p => p.draw(ctx));
        this.floatTexts.forEach(ft => ft.draw(ctx));
      }

      drawMoon(ctx) {
        const mx = this.width * 0.82;
        const my = Math.min(this.height * 0.16, 115);
        const mr = Math.min(this.width * 0.08, 46);

        ctx.save();
        const glow = ctx.createRadialGradient(mx, my, mr * 0.5, mx, my, mr * 2.5);
        glow.addColorStop(0, 'rgba(255, 230, 140, 0.35)');
        glow.addColorStop(0.5, 'rgba(255, 220, 100, 0.12)');
        glow.addColorStop(1, 'rgba(255, 220, 100, 0)');
        ctx.fillStyle = glow;
        ctx.beginPath();
        ctx.arc(mx, my, mr * 2.5, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#fff4ba';
        ctx.shadowColor = '#ffe066';
        ctx.shadowBlur = 18;
        ctx.beginPath();
        ctx.arc(mx, my, mr, 0.2 * Math.PI, 1.4 * Math.PI, false);
        ctx.bezierCurveTo(mx - mr * 0.2, my - mr * 0.6, mx - mr * 0.2, my + mr * 0.6, mx + Math.cos(0.2 * Math.PI) * mr, my + Math.sin(0.2 * Math.PI) * mr);
        ctx.closePath();
        ctx.fill();

        // Sleeping kawaii eye & smile
        ctx.shadowBlur = 0;
        ctx.strokeStyle = '#bfa142';
        ctx.lineWidth = 2.5;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.arc(mx - mr * 0.35, my + 4, 6, 0.1 * Math.PI, 0.9 * Math.PI, false);
        ctx.stroke();

        ctx.restore();
      }

      drawStars(ctx) {
        ctx.save();
        const time = performance.now() * 0.002;
        this.stars.forEach(s => {
          const alpha = s.baseAlpha + Math.sin(time * 3 + s.phase) * 0.28;
          ctx.globalAlpha = Math.max(0.15, Math.min(1, alpha));
          ctx.fillStyle = s.color;
          ctx.beginPath();
          ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
          ctx.fill();
        });
        ctx.restore();
      }

      drawClouds(ctx) {
        ctx.save();
        this.clouds.forEach(c => {
          c.x += c.speed;
          if (c.x - c.r * 2 > this.width) c.x = -c.r * 2;

          ctx.fillStyle = `rgba(180, 170, 225, ${c.alpha})`;
          ctx.beginPath();
          ctx.arc(c.x, c.y, c.r, 0, Math.PI * 2);
          ctx.arc(c.x + c.r * 0.6, c.y - c.r * 0.3, c.r * 0.8, 0, Math.PI * 2);
          ctx.arc(c.x + c.r * 1.2, c.y, c.r * 0.7, 0, Math.PI * 2);
          ctx.fill();
        });
        ctx.restore();
      }
    }

    window.onload = function () {
      new Game();
    };
  </script>
